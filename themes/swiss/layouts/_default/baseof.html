<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:site_name" content="{{ .Site.Title }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  {{ with .Description | default .Summary }}<meta property="og:description" content="{{ . | plainify | truncate 200 }}">{{ end }}
  {{ with .Params.cover }}<meta property="og:image" content="{{ . | absURL }}">{{ end }}
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="{{ "css/style.css" | absURL }}">
  <script>
    (function(){
      var s = localStorage.getItem('theme') || 'system';
      if (s === 'dark' || (s === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="nav-title" href="{{ .Site.BaseURL }}">{{ .Site.Title | default "Home" }}</a>
      <div class="nav-right">
        <ul class="nav-links">
          <li><a href="{{ "blog/" | absURL }}">Blog</a></li>
          <li><a href="{{ "projects/list/" | absURL }}">Projects</a></li>
          <li><a href="{{ "about/" | absURL }}">About</a></li>
        </ul>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle color scheme">◐</button>
      </div>
    </nav>
  </header>
  <main class="container">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <span>&copy; {{ now.Year }} {{ .Site.Title }}</span>
  </footer>
  <script>
    (function(){
      var btn = document.getElementById('theme-toggle');
      var modes = ['system','light','dark'];
      var labels = {'system':'◐','light':'☀','dark':'●'};
      var current = localStorage.getItem('theme') || 'system';
      btn.textContent = labels[current];
      btn.addEventListener('click', function(){
        var i = (modes.indexOf(current) + 1) % modes.length;
        current = modes[i];
        localStorage.setItem('theme', current);
        btn.textContent = labels[current];
        if (current === 'dark' || (current === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      });
    })();
  </script>
</body>
</html>
